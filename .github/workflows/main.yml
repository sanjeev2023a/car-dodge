name: Build Car Dodge Release APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack & Fix Project Files
        run: |
          git clone https://github.com/sanjeev2023a/car-dodg.git /tmp/old_repo || true
          cp -n /tmp/old_repo/*.zip . 2>/dev/null || true
          for z in *.zip; do
            test -f "$z" && unzip -o -q "$z"
          done
          test -d TrafficDodge2D_HighwayLegend && cp -rf TrafficDodge2D_HighwayLegend/* . || true
          MAIN_KT="app/src/main/java/com/highwaylegend/trafficdodge2d/MainActivity.kt"
          sed -i 's/initialCoins = totalCoins/coins = totalCoins/g' "$MAIN_KT"
          sed -i 's/initialBest = highScore/bestScore = highScore/g' "$MAIN_KT"
          sed -i 's/compileSdk = 35/compileSdk = 34/g' app/build.gradle.kts
          sed -i 's/targetSdk = 35/targetSdk = 34/g' app/build.gradle.kts
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/g' app/build.gradle.kts
          sed -i 's/viewBinding = true/viewBinding = false/g' app/build.gradle.kts
          sed -i 's/core-ktx:1.13.1/core-ktx:1.12.0/g' app/build.gradle.kts
          sed -i 's/appcompat:1.7.0/appcompat:1.6.1/g' app/build.gradle.kts
          sed -i 's/material:1.12.0/material:1.11.0/g' app/build.gradle.kts
          sed -i 's/activity-ktx:1.9.2/activity-ktx:1.8.2/g' app/build.gradle.kts
          sed -i 's/play-services-ads:23.3.0/play-services-ads:23.0.0/g' app/build.gradle.kts
          sed -i 's/8.5.2/8.3.2/g' build.gradle.kts
          sed -i 's/1.9.24/1.9.22/g' build.gradle.kts
          sed -i 's/tools:targetApi="35"/tools:targetApi="34"/g' app/src/main/AndroidManifest.xml
          test -f app/src/main/res/drawable/ic_launcher.png && rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate V1+V2+V3 Release Signing Keystore
        run: |
          rm -f app/release-keystore.jks
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias highway_legend_key \
            -storepass "HighwayLegend2026!" \
            -keypass "HighwayLegend2026!" \
            -dname "CN=Car Dodge, OU=GameStudio, O=HighwayLegend, L=Patna, S=BR, C=IN"

      - name: Build Signed Release APK & Play Store AAB
        id: gradle_build
        continue-on-error: true
        run: |
          gradle assembleRelease bundleRelease -x lint -x lintVitalRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/release-keystore.jks \
            -Pandroid.injected.signing.store.password=HighwayLegend2026! \
            -Pandroid.injected.signing.key.alias=highway_legend_key \
            -Pandroid.injected.signing.key.password=HighwayLegend2026! > build.log 2>&1

      - name: Show Error Details If Build Failed
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "### Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -E "e: |FAILURE:|What went wrong|> |Execution failed" -A 4 build.log >> $GITHUB_STEP_SUMMARY || true
          echo "--- Last 40 Lines ---" >> $GITHUB_STEP_SUMMARY
          tail -n 40 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log
          exit 1

      - name: Upload Signed APK, AAB & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: CarDodge-v1.0-Signed-Release-Files
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/release-keystore.jks
            
